
name: Build PowerTools

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build PowerTools
        run: mvn -B -U clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v6
        with:
          name: PowerTools-2.0.0
          path: target/PowerTools-2.0.0.jar
          if-no-files-found: error
