name: Build Minecraft Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Java 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Mit Maven bauen (Kompilieren & Packaging)
      run: mvn clean package

    - name: Plugin-Artefakt hochladen
      uses: actions/upload-artifact@v4
      with:
        name: PowerTools-Plugin
        path: target/*.jar
